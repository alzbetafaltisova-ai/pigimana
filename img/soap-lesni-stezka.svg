    <!-- zrnitost -->
    <rect x="70" y="86" width="340" height="186" filter="url(#grain-lesnistezka)" opacity=".55"/>
    <!-- lesk -->
    <rect x="70" y="86" width="340" height="186" fill="url(#sheen-lesnistezka)"/>
  </g>

  <!-- hrana horní plochy -->
  <rect x="70.5" y="86.5" width="339" height="185" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".35"/>

  <!-- ražba -->
  <g font-family="Cormorant Garamond, Georgia, serif" font-size="22" letter-spacing="6" text-anchor="middle">
    <text x="240.0" y="188.0" fill="#fff" fill-opacity=".35">PIGIMANA</text>
