      <stop offset="0" stop-color="#b08b6d"/>
      <stop offset="1" stop-color="#7e5d43"/>
    </linearGradient>
    <radialGradient id="sheen-rannikava" cx=".25" cy=".15" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".08"/>
